# Shared by the CI and dependency-audit workflows.
name: Setup Node + pnpm
description: Install pnpm and Node 24, then the dev dependencies from pnpm-lock.yaml.

runs:
  using: composite
  steps:
    # Reads `packageManager`, so CI runs the exact pnpm, hash included, a contributor runs.
    - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

    # After pnpm, so `cache: pnpm` finds it.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    # --frozen-lockfile fails on a lockfile out of sync with package.json instead of rewriting it.
    # No dependency install script runs: pnpm-workspace.yaml allows none.
    - shell: bash
      run: pnpm install --frozen-lockfile
