# Dependabot keeps the pinned GitHub Actions SHAs and the exact dev dependency
# versions in package.json and pnpm-lock.yaml fresh. Minors and patches are
# grouped into one weekly PR; an action major arrives as its own PR, so a renamed
# input or a new requirement is reviewed on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Supply-chain quarantine: wait 7 days after a version is published before
    # proposing it. A compromised release is usually pulled within that window.
    # Security updates bypass the cooldown.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
  # The type checker, Node's types and oxlint, pinned to exact versions in
  # package.json and pnpm-lock.yaml. pnpm uses the `npm` ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Supply-chain quarantine graded by SemVer risk. The patch figure is 3 days
    # to match `minimumReleaseAge: 4320` in pnpm-workspace.yaml: a shorter one
    # would propose versions pnpm then refuses to resolve. Security updates
    # bypass the cooldown.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    versioning-strategy: increase
    # Node 24 is the runtime the CI setup and `engines` fix, so `@types/node`
    # stays on the 24 major: a newer one describes APIs the runtime lacks. A new
    # Node major is a deliberate change that moves the CI, `engines` and these
    # types together, never a Dependabot pull request.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      tooling:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "typescript"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
