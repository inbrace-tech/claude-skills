# Weekly updates for the pinned action SHAs and the exact dev dependencies. Minors and patches are
# grouped; an action major gets its own PR so its breaking changes are reviewed alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Supply-chain quarantine: a compromised release is usually pulled within 7 days.
    # Security updates bypass it.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
  # pnpm uses the `npm` ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Quarantine graded by SemVer risk. Patch matches `minimumReleaseAge` (3 days); shorter would
    # propose versions pnpm refuses to resolve. Security updates bypass it.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    versioning-strategy: increase
    # `@types/node` stays on 24, the Node that CI and `engines` fix: a newer major describes APIs the
    # runtime lacks. A Node major moves all three together, deliberately, never via Dependabot.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      tooling:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "typescript"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
