name: Bug report
description: A skill gives wrong advice, fails to install, or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Plugin and skill
      description: e.g. inbrace-config / audit
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Claude Code version and model
      description: e.g. Claude Code 2.1.280, Claude Opus 5.5
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant part of the skill's output. Remove anything private first.
      render: text
