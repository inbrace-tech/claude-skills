# Daily sweep of main: advisories (`pnpm audit`) and versions withdrawn from the registry since they
# merged (`pnpm run audit:lockfile:all`, takedowns only), which no pull request would surface.
# Not a merge gate: a PR whose diff cannot fix the finding should not go red.
name: Dependency audit (daily)

on:
  # 03:00 UTC: scheduled runs can start hours late and should still land before the workday.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-sweep:
    name: Daily sweep (advisories + takedowns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No history needed: neither question compares against a base ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit the locked dependency tree
        run: pnpm audit --audit-level=high
      # `!cancelled()` so a red audit above never hides a takedown here.
      - name: No resolved version has been withdrawn from the registry
        if: '!cancelled()'
        run: pnpm run audit:lockfile:all
