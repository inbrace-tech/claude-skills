# Dependency audit on each PR: `pnpm audit` for high and critical advisories, and the lockfile audit
# for versions this PR adds that are gone from the registry or younger than `minimumReleaseAge`.
# Kept out of ci.yml, whose checks are all offline, so a red CI never means the network blipped.
# An unreachable registry fails the lockfile audit; it never passes green.
name: Dependency audit

on:
  # No `paths:` filter: a job that never runs looks like one that passed.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Advisories and lockfile release age
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to read pnpm-lock.yaml at the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # High and critical only: every dependency is a dev tool, and lower severities are noise.
      - name: Audit the locked dependency tree
        run: pnpm audit --audit-level=high
      # Against the PR's base commit, not a moving origin/main. `!cancelled()` so a failed
      # advisory step never hides a takedown.
      - name: Every version this PR adds is published and past the age floor
        if: '!cancelled()'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm run audit:lockfile --base "${BASE_SHA}" --verbose
