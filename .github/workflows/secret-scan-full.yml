# Full-history secret scan: gitleaks over every commit of every branch and tag, on demand only. Run it
# after a history rewrite, after bumping GITLEAKS_VERSION (new rules reach old commits), and
# periodically. It never runs on pull_request, so it blocks nobody; secret-scan.yml covers each PR.
# A real leak: rotate the secret first, then purge it from history. A false positive: add it to the
# allowlist in .gitleaks.toml. Keep GITLEAKS_VERSION equal to secret-scan.yml's.
name: Secret scan (full history)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks, full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 brings every branch and tag; persist-credentials: false keeps the token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      # --redact keeps a found secret out of the run log; --all walks every ref, not only the checked-out branch.
      - name: Scan every commit for leaked secrets
        run: gitleaks git --no-banner --redact --verbose --log-opts="--all"
