# PR title: validates the title against conventional commits. After a squash
# merge the title becomes the commit subject on main.
name: PR title (semantic)

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: github.actor != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Example: "feat: add a review skill"
