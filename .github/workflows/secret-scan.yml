# Secret scan: gitleaks over the PR's commits (base..head), so a secret added and removed within the
# PR is still caught. The release binary is verified against its published checksums; the gitleaks
# Action needs a paid license for organizations. Bump GITLEAKS_VERSION by hand: Dependabot skips it.
name: Secret scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      # --redact keeps a found secret out of the run log.
      - name: Scan PR commits for leaked secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
