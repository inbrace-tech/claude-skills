# CI: validates the marketplace manifest, every plugin manifest, every skill
# and every agent with `claude plugin validate --strict`, then type-checks,
# lints and tests the repository scripts and checks every norm against its sidecar, on
# every PR and push to main.
# --strict turns warnings (unknown fields, missing metadata) into failures.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Abort stale PR runs when a new commit lands on the same branch; never cancel
# push-to-main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false keeps the job token out of .git/config, where
      # any later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24, pnpm from `packageManager`, and the dev dependencies from the
      # lockfile: the type checker, Node's types and oxlint.
      - uses: ./.github/actions/setup-node-pnpm
      # Pinned version: bump it deliberately, so a CLI release never changes
      # what CI accepts without a reviewed diff. A global CLI, not a dependency
      # of this repository, so it goes through the npm that ships with Node.
      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: 2.1.280
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace, plugins, skills and agents
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
            claude plugin validate --strict "${plugin}skills"
            if [ -d "${plugin}agents" ]; then
              claude plugin validate --strict "${plugin}agents"
            fi
          done
      # The repository's scripts are TypeScript that Node 24 runs as is.
      - name: Type-check scripts
        run: pnpm run typecheck
      # `pnpm run lint` runs `oxlint --fix`; here the check runs without --fix,
      # so a finding fails the job instead of being rewritten on the runner.
      - name: Lint scripts
        run: pnpm exec oxlint
      # The repository's own scripts, on Node's built-in test runner.
      - name: Test scripts
        run: pnpm test
      # Every norm in a SKILL.md or an agent's <name>.md has an entry in its
      # sidecar and vice versa, and every [Nxx] cross-reference resolves.
      - name: Check norms against their sidecars
        run: pnpm run check-norms
