# CI on every PR and push to main: `claude plugin validate --strict` (warnings fail) over the
# marketplace, plugins, skills and agents, then typecheck, lint, test and check-norms.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale PR runs, never push-to-main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false keeps the job token out of .git/config, where later steps could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Pinned so a CLI release never changes what CI accepts without a reviewed diff.
      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: 2.1.280
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace, plugins, skills and agents
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
            claude plugin validate --strict "${plugin}skills"
            if [ -d "${plugin}agents" ]; then
              claude plugin validate --strict "${plugin}agents"
            fi
          done
      - name: Type-check scripts
        run: pnpm run typecheck
      # Without the --fix `pnpm run lint` passes, so a finding fails instead of being rewritten.
      - name: Lint scripts
        run: pnpm exec oxlint
      - name: Test scripts
        run: pnpm test
      - name: Check norms against their sidecars
        run: pnpm run check-norms
