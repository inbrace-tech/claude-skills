# pnpm 11 reads its settings here, not from package.json.
# No `allowBuilds`: no dependency runs an install script. One that starts needing it fails the install
# and is opted in here by name after review.

# Minutes (4320 = 3 days): pnpm resolves no younger version, falling back to an older one, so a
# malicious publish must go undetected for three days to reach an install. Dependabot's patch cooldown
# matches.
minimumReleaseAge: 4320
# Off on purpose: it only matters when no version clears the floor. On, that install needs an approval
# written here, which Dependabot's pnpm updates cannot write, so they would fail.
minimumReleaseAgeStrict: false
